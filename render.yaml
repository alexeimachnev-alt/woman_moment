services:
  - type: web
    name: catalog-5ka-miniapp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: STORE_SAP_CODE
        value: "Y232"
